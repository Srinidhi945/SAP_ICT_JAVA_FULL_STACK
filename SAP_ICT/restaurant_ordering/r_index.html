<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Inti Bojanam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-warning shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="logo.jpg" alt="Mana Inti Bojanam Logo">
        <span class="fw-bold text-success">Mana Inti Bojanam</span>
      </a>
      <!-- Cart Toggle Button -->
      <button class="btn btn-danger" id="cart-toggle">🛒 Cart (<span id="cart-count">0</span>)</button>
    </div>
  </nav>

  <!-- Collapsible Cart Section -->
  <div class="container my-3 d-none" id="cart-section">
    <h2 class="text-center mb-4 text-danger">🛒 Your Cart</h2>
    <div id="cart">
      <ul id="cart-items" class="list-group mb-3"></ul>
      <h4 class="text-success">Total: ₹<span id="total">0</span></h4>
      <button class="btn btn-primary mt-3 w-100" onclick="placeOrder()">Place Order</button>
    </div>
  </div>

  <!-- Menu Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4 text-primary">🌿 Our Menu 🌿</h2>
    <div class="row" id="menu">
      <!-- Menu items will be injected here -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Mana Inti Bojanam | Made with ❤️ in Hyderabad</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
